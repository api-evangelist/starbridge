aid: starbridge
name: Starbridge
description: >-
  Starbridge is an AI-powered go-to-market and sales-intelligence platform for
  vendors selling to the public sector and education — government agencies, K-12
  school districts, and higher-education institutions. It surfaces early buying
  signals (RFPs, board meetings, purchases, conferences, contact and job changes),
  scores and enriches target accounts, and drafts personalized outbound and RFP
  responses. Starbridge exposes an external REST API (Bearer API keys), Ed25519-signed
  webhooks, and a hosted OAuth MCP server, plus published Agent Skills, so buyer
  intelligence can be pulled into CRMs (Salesforce, HubSpot), Slack, Zapier, and AI
  agents. Backed by Craft Ventures.
