  advertised_at: https://hc.starbridge.ai/.well-known/mcp.json
  url: https://starbridge.main-kill-isr.mintlify.me/mcp
  transport: http
  authentication: none
  hosted_by: Mintlify (not a Starbridge-controlled host)
  method: probed
  probe:
    request: 'POST tools/list'
    status: 200
    checked: '2026-08-14'
  tools:
  - name: search_starbridge_help_center
    description: Search the Starbridge Help Center knowledge base for docs, API references, and guides.
  - name: query_docs_filesystem_starbridge_help_center
    description: Read-only shell-like query (ls/cat/head/rg/tree) over a virtual filesystem of the docs pages and OpenAPI specs.
